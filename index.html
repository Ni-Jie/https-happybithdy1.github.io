<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎂 送你一份生日祝福</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Yuanti SC","YouYuan","Microsoft YaHei",sans-serif; }
  body { background:linear-gradient(160deg,#ffd6e8 0%,#ffeef5 45%,#fff6e8 100%); }

  .page { min-height:100vh; min-height:100dvh; }
  .hidden { display:none !important; }

  /* ============ 封面页 ============ */
  #page1 { position:relative; display:flex; align-items:center; justify-content:center; padding:28px 18px; overflow:hidden; }
  .float-deco { position:absolute; pointer-events:none; opacity:.7; animation:floaty linear infinite; z-index:0; }
  @keyframes floaty {
    0%   { transform:translateY(105vh) rotate(0deg); }
    100% { transform:translateY(-12vh) rotate(360deg); }
  }
  .card {
    position:relative; z-index:2; width:100%; max-width:430px;
    background:rgba(255,255,255,.88); backdrop-filter:blur(6px);
    border-radius:28px; padding:34px 26px 30px;
    box-shadow:0 18px 50px rgba(255,105,160,.28), inset 0 0 0 2px rgba(255,255,255,.9);
    animation:pop .6s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .card h1 { font-size:26px; text-align:center; color:#e0447c; letter-spacing:1px; margin-bottom:6px; }
  .card .tip { text-align:center; font-size:14px; color:#b06a8c; margin-bottom:22px; }
  .field { margin-bottom:18px; }
  .field label { display:block; font-size:15px; font-weight:700; color:#d63384; margin-bottom:8px; }
  .field input, .field textarea {
    width:100%; border:2px solid #ffc2da; border-radius:16px; background:#fff;
    padding:13px 15px; font-size:16px; color:#5a3049; outline:none; font-family:inherit;
    transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field textarea:focus { border-color:#ff6fa5; box-shadow:0 0 0 4px rgba(255,111,165,.18); }
  .field textarea { min-height:130px; resize:none; line-height:1.7; font-size:15px; }
  #confirmBtn {
    width:100%; border:none; border-radius:999px; padding:16px 0; margin-top:6px;
    font-size:19px; font-weight:800; color:#fff; letter-spacing:4px; cursor:pointer;
    background:linear-gradient(135deg,#ff6fa5,#ff9a6c);
    box-shadow:0 10px 24px rgba(255,111,165,.45);
    transition:transform .15s;
  }
  #confirmBtn:active { transform:scale(.95); }
  .shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  #toast {
    position:fixed; left:50%; top:18%; transform:translateX(-50%) translateY(-8px);
    background:rgba(60,20,45,.88); color:#fff; padding:11px 22px; border-radius:999px;
    font-size:15px; opacity:0; transition:.3s; z-index:99; pointer-events:none; white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ============ 祝福页 ============ */
  #page2 { background:linear-gradient(160deg,#ffd6e8 0%,#ffeef5 45%,#fff6e8 100%); padding:10px 10px 34px; }
  #stage { display:block; width:100%; max-width:460px; margin:0 auto; border-radius:18px;
           box-shadow:0 12px 40px rgba(0,0,0,.45); animation:pop .7s cubic-bezier(.2,1.4,.4,1); }
  .btn-row { max-width:460px; margin:18px auto 0; display:flex; flex-direction:column; gap:12px; padding:0 4px; }
  .btn {
    border:none; border-radius:999px; padding:15px 0; font-size:17px; font-weight:800;
    font-family:inherit; cursor:pointer; letter-spacing:1px; transition:transform .15s;
  }
  .btn:active { transform:scale(.96); }
  .btn-primary { color:#fff; background:linear-gradient(135deg,#ff6fa5,#ff9a6c); box-shadow:0 8px 22px rgba(255,111,165,.5); }
  .btn-primary:disabled { opacity:.6; }
  .btn-ghost { color:#c2437e; background:rgba(255,255,255,.55); border:1.5px solid rgba(194,67,126,.4); }
  .btn-mini { color:#c2437e; background:rgba(255,255,255,.55); border:1px solid rgba(194,67,126,.35); padding:11px 0; font-size:14px; }
  .note { text-align:center; color:rgba(160,60,110,.7); font-size:12px; margin-top:14px; }

  #recOverlay {
    position:fixed; inset:0; background:rgba(20,5,35,.72); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  #recOverlay .ball { width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffb3d1, #ff4d8d 60%, #d61f6d);
    animation:pulse 1s ease-in-out infinite; box-shadow:0 0 40px rgba(255,77,141,.8); }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
  #recOverlay p { color:#fff; font-size:17px; letter-spacing:1px; }
  #recOverlay .sec { color:#ffb3d1; font-size:30px; font-weight:800; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- ================= 第 1 页：封面 ================= -->
<div id="page1" class="page">
  <div class="card">
    <h1>🎂 送一份生日祝福 🎂</h1>
    <p class="tip">填一填，为 TA 生成一段专属的生日祝福视频吧～</p>

    <div class="field">
      <label>🌸 祝福对象的昵称</label>
      <input id="nickInput" type="text" maxlength="10" placeholder="例如：阿清" autocomplete="off">
    </div>

    <div class="field">
      <label>💌 想对 TA 说的话（可修改）</label>
      <textarea id="blessInput">祝你生日快乐，希望你焦虑的事情都不再困扰你，找到自己喜欢做的事情，并能挣好多好多的钱</textarea>
    </div>

    <button id="confirmBtn">确 定</button>
  </div>
</div>

<!-- ================= 第 2 页：祝福 ================= -->
<div id="page2" class="page hidden">
  <canvas id="stage" width="720" height="1280"></canvas>

  <div class="btn-row">
    <button id="downloadBtn" class="btn btn-primary">🎬 下载祝福视频（发给朋友）</button>
    <button id="musicBtn" class="btn btn-mini">🔊 音乐：开</button>
    <button id="backBtn" class="btn btn-ghost">↩ 返回修改</button>
  </div>
  <p class="note">视频为 9:16 竖屏，含生日快乐音乐，约 22 秒</p>
</div>

<div id="recOverlay" class="hidden">
  <div class="ball"></div>
  <p id="recLabel">正在生成祝福视频…</p>
  <p class="sec" id="recSec">0%</p>
</div>

  var bin=atob(b64), len=bin.length, bytes=new Uint8Array(len);
  for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function initAudio(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=0.5;
    masterGain.connect(audioCtx.destination);
    audioDest=audioCtx.createMediaStreamDestination();
    masterGain.connect(audioDest);
  }catch(e){ audioCtx=null; return; }
  try{
    decodePromise=new Promise(function(res){
      audioCtx.decodeAudioData(b64ToBuf(AUDIO_B64),function(buf){
        audioBuffer=buf;
        if(!muted) startMusic();
        res();
      },function(){ res(); });
    });
  }catch(e){ decodePromise=Promise.resolve(); }
}
function startMusic(){
  if(!audioCtx||!audioBuffer) return;
  stopMusic();
  musicSource=audioCtx.createBufferSource();
  musicSource.buffer=audioBuffer;
  musicSource.loop=true;
  musicSource.connect(masterGain);
  try{ musicSource.start(0); }catch(e){}
}
function stopMusic(){
  if(musicSource){ try{ musicSource.stop(0); }catch(e){} musicSource=null; }
}
function restartSong(){
  if(!audioCtx||!audioBuffer) return;
  if(!muted) startMusic();   /* 从头播放上传的音乐 */
}

$("musicBtn").addEventListener("click",function(){
  muted=!muted;
  this.textContent=muted?"🔇 音乐：关":"🔊 音乐：开";
  if(masterGain) masterGain.gain.value=muted?0:0.5;
});

var cv=$("stage"), ctx=cv.getContext("2d");
var W=720, H=1280;
var TAU=Math.PI*2;
function rnd(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* 背景星星 */

for(var i=0;i<90;i++) bgStars.push({x:rnd(0,W),y:rnd(0,760),r:rnd(0.8,2.4),sp:rnd(1,3),ph:rnd(0,TAU)});

/* 彩带上的火花 */
function star(x,y,r,rot,color,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=color;
  ctx.beginPath();
  for(var i=0;i<5;i++){
    var a=i*TAU/5-Math.PI/2, a2=a+TAU/10;
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    ctx.lineTo(Math.cos(a2)*r*0.45,Math.sin(a2)*r*0.45);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* 烟花 */
var rockets=[], parts=[], lastLaunch=0;
var FW_COLORS=[["#ffd166","#ff9f1c"],["#ff4d8d","#ff9ec6"],["#3fb8f5","#8fdcff"],["#b44de8","#d9a0ff"],["#ff4d4d","#ff9e9e"],["#2ed573","#8df5b4"]];
function launch(t){
  var fromLeft=Math.random()<0.5;
  rockets.push({
    x:fromLeft?rnd(70,250):rnd(470,650),
    y:820, vy:rnd(9.5,12), vx:rnd(-0.7,0.7),
    ty:rnd(100,350),
    c:FW_COLORS[(Math.random()*FW_COLORS.length)|0]
  });
}
function explode(r){
  /* 爆炸闪光 */
  flashes.push({x:r.x,y:r.y,r:8,life:1,c:r.c[1]});
  var n=130+((Math.random()*50)|0);
  for(var i=0;i<n;i++){
    var a=Math.random()*TAU, sp=rnd(2.5,7.8);
    parts.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,decay:rnd(0.004,0.009),c:Math.random()<0.5?r.c[0]:r.c[1],px:r.x,py:r.y,
      tw:Math.random()<0.3});
  }
}
var flashes=[];
/* 烟花状态推进一步（约 1/60 秒） */
function simFw(t){
  var i;
  if(t-lastLaunch>rnd(0.4,0.75) && rockets.length<4){ launch(t); lastLaunch=t; }
  for(i=rockets.length-1;i>=0;i--){
    var r=rockets[i];
    r.y-=r.vy; r.x+=r.vx; r.vy*=0.985;
    if(r.y<=r.ty){ explode(r); rockets.splice(i,1); }
  }
  for(i=flashes.length-1;i>=0;i--){
    var f=flashes[i];
    f.r+=3.6; f.life-=0.055;
    if(f.life<=0) flashes.splice(i,1);
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.px=p.x; p.py=p.y;
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.vx*=0.982; p.vy*=0.982;
    p.life-=p.decay;
    if(p.life<=0) parts.splice(i,1);
  }
}
/* 烟花绘制 */
function drawFw(t){
  var i,j;
  for(i=0;i<rockets.length;i++){
    var r=rockets[i];
    ctx.strokeStyle=r.c[0]; ctx.lineWidth=4; ctx.globalAlpha=0.95;
    ctx.beginPath(); ctx.moveTo(r.x,r.y+20); ctx.lineTo(r.x,r.y); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(r.x,r.y,3.2,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation="lighter";
  for(i=0;i<flashes.length;i++){
    var f=flashes[i];
    ctx.globalAlpha=f.life*0.85;
    var fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    fg.addColorStop(0,"#ffffff"); fg.addColorStop(0.4,f.c); fg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
  for(j=0;j<parts.length;j++){
    var p=parts[j];
    var al=p.life;
    if(p.tw) al*=0.5+0.5*Math.sin(t*18+j);
    ctx.globalAlpha=al*0.35;
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=4.6;
    ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.globalAlpha=al;
    ctx.strokeStyle=p.c; ctx.lineWidth=2.8;
    ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* 蛋糕数据 */
var CX=360;
var L1={top:585,bot:700,rx:165};
var L2={top:495,bot:588,rx:128};
var L3={top:415,bot:500,rx:95};
var ROT_SPEED=0.35;

/* 固定装饰（初始化一次，避免闪烁） */
var sprinkles=[], stars2=[], figures=[], drips2=[], drips3=[];
(function initDeco(){
  var cols=["#ff9eb8","#ffd98a","#8fd8f5","#d3b0f5","#9df0c8","#ffc09a","#ffffff"];
  var i;
  for(i=0;i<26;i++) sprinkles.push({a:rnd(0,TAU),r:rnd(0.25,0.85),c:cols[i%cols.length],rot:rnd(0,TAU),layer:1});
  for(i=0;i<18;i++) sprinkles.push({a:rnd(0,TAU),r:rnd(0.25,0.85),c:cols[(i+3)%cols.length],rot:rnd(0,TAU),layer:3});
  for(i=0;i<12;i++) stars2.push({a:rnd(0,TAU),y:rnd(14,78),c:cols[(i*2)%cols.length],s:rnd(6,10)});
  var fcols=["#8a5aa8","#a06ec0","#8a5aa8"];
  for(i=0;i<3;i++) figures.push({a:i*TAU/3+0.6,c:fcols[i]});
  for(i=0;i<26;i++) drips2.push(rnd(8,26));
  for(i=0;i<20;i++) drips3.push(rnd(7,20));
})();

function rimY(cx,rx,ry,x){
  var k=clamp((x-cx)/rx,-1,1);
  return ry*Math.sin(Math.acos(k));
}
function dripBand(cx,topY,rx,ry,pattern,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  var x,y,i,step=8;
  ctx.moveTo(cx-rx,topY+rimY(cx,rx,ry,-rx));
  for(x=cx-rx;x<=cx+rx;x+=step) ctx.lineTo(x,topY+rimY(cx,rx,ry,x));
  for(x=cx+rx;x>=cx-rx;x-=step){
    var idx=Math.floor((x-(cx-rx))/((rx*2)/pattern.length))%pattern.length;
    if(idx<0) idx=0;
    var d=6+pattern[idx]+Math.sin(x*0.09)*3;
    ctx.lineTo(x,topY+rimY(cx,rx,ry,x)+d);
  }
  ctx.closePath(); ctx.fill();
}
function dollops(cx,topY,rx,ry,color){
  ctx.fillStyle=color;
  for(var x=cx-rx+8;x<=cx+rx-8;x+=17){
    ctx.beginPath();
    ctx.arc(x,topY+rimY(cx,rx,ry,x),7.5,0,TAU);
    ctx.fill();
  }
}
function cylinder(cx,topY,botY,rx,fillFn){
  var h=botY-topY, ry=rx*0.24;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-rx,topY);
  ctx.lineTo(cx-rx,botY);
  ctx.ellipse(cx,botY,rx,ry,0,Math.PI,0,true);
  ctx.lineTo(cx+rx,topY);
  ctx.ellipse(cx,topY,rx,ry,0,0,Math.PI,true);
  ctx.closePath();
  ctx.clip();
  fillFn(cx-rx,topY,rx*2,h+ry);
  var g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);
  g.addColorStop(0,"rgba(0,0,0,0.32)"); g.addColorStop(0.25,"rgba(0,0,0,0)");
  g.addColorStop(0.72,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,0.32)");
  ctx.fillStyle=g; ctx.fillRect(cx-rx,topY-ry,rx*2,h+ry*2);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(cx,botY,rx,ry,0,0,Math.PI,false);
  ctx.strokeStyle="rgba(0,0,0,0.12)"; ctx.lineWidth=2; ctx.stroke();
}
function topFace(cx,topY,rx,color){
  ctx.beginPath(); ctx.ellipse(cx,topY,rx,rx*0.24,0,0,TAU);
  ctx.fillStyle=color; ctx.fill();
}
function figure(x,y,s,color,alpha,t,seed){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.strokeStyle=color;
  var wave=Math.sin(t*4+seed)*4;
  ctx.lineWidth=2.6; ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(0,-22,4.5,0,TAU); ctx.fill();        /* 头 */
  ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(0,-6); ctx.stroke(); /* 身 */
  ctx.beginPath(); ctx.moveTo(-7,-14-wave*0.4); ctx.lineTo(0,-11); ctx.lineTo(7,-15+wave*0.4); ctx.stroke(); /* 手 */
  ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(-5,4); ctx.moveTo(0,-6); ctx.lineTo(5,4); ctx.stroke(); /* 腿 */
  ctx.restore();
}
function flame(x,y,s,t,seed){
  var f=1+Math.sin(t*11+seed)*0.14+Math.sin(t*6.3+seed*2.7)*0.09;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  var g=ctx.createRadialGradient(x,y,0,x,y,26*s*f);
  g.addColorStop(0,"rgba(255,220,120,0.55)"); g.addColorStop(1,"rgba(255,160,40,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,26*s*f,0,TAU); ctx.fill();
  ctx.translate(x,y); ctx.scale(s*f,s*(1+ (f-1)*1.6));
  ctx.beginPath();
  ctx.moveTo(0,-16);
  ctx.bezierCurveTo(7,-6,6,2,0,3);
  ctx.bezierCurveTo(-6,2,-7,-6,0,-16);
  var fg=ctx.createLinearGradient(0,-16,0,3);
  fg.addColorStop(0,"#ff9f1c"); fg.addColorStop(0.55,"#ffd166"); fg.addColorStop(1,"#fff3b0");
  ctx.fillStyle=fg; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-2,2.2,4.5,0,0,TAU); ctx.fillStyle="#fff8dc"; ctx.fill();
  ctx.restore();
}
/* 糖果珠边：沿层底前排一圈马卡龙色糖珠 */
var BEAD_COLS=["#ff9ec6","#a8e6cf","#ffd98a","#c9b6f5","#8fd8f5"];
function beadBorder(cx,botY,rx,ry,r){
  var n=0;
  for(var x=cx-rx+9;x<=cx+rx-9;x+=r*2.5){
    var y=botY+rimY(cx,rx,ry,x)-r*0.35;
    var c=BEAD_COLS[n%BEAD_COLS.length]; n++;
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
    ctx.fillStyle=c; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.35,r*0.28,0,TAU);
    ctx.fillStyle="rgba(255,255,255,0.85)"; ctx.fill();
  }
}
function candle(x,baseY,h,t,seed,stripe){
  ctx.save();
  ctx.fillStyle="#fff";
  ctx.strokeStyle="rgba(0,0,0,0.1)";
  var w=11;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x-w/2,baseY-h,w,h,4); else ctx.rect(x-w/2,baseY-h,w,h);
  ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.rect(x-w/2,baseY-h,w,h); ctx.clip();
  ctx.strokeStyle=stripe||"#ff6fa5"; ctx.lineWidth=3.4;
  for(var yy=baseY-h-8;yy<baseY+8;yy+=9){
    ctx.beginPath(); ctx.moveTo(x-w/2-2,yy); ctx.lineTo(x+w/2+2,yy-5); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle="#5a4632"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x,baseY-h); ctx.lineTo(x,baseY-h-5); ctx.stroke();
  flame(x,baseY-h-9,1,t,seed);
  ctx.restore();
}

/* 蛋糕主体 */
function drawCake(t,rot){
  /* 蛋糕底部光晕 */
  var glow=ctx.createRadialGradient(CX,720,10,CX,720,260);
  glow.addColorStop(0,"rgba(255,150,200,0.30)"); glow.addColorStop(1,"rgba(255,150,200,0)");
  ctx.fillStyle=glow; ctx.fillRect(CX-270,460,540,400);

  /* 托盘 */
  ctx.beginPath(); ctx.ellipse(CX,712,205,30,0,0,TAU);
  var pg=ctx.createLinearGradient(CX-205,690,CX+205,740);
  pg.addColorStop(0,"#ffe3f0"); pg.addColorStop(0.5,"#fff9fc"); pg.addColorStop(1,"#f5c6dd");
  ctx.fillStyle=pg; ctx.fill();
  ctx.strokeStyle="rgba(214,51,132,0.35)"; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(CX,726,150,16,0,0,Math.PI);
  ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.stroke();

  /* --- 第一层：糖果色柔和彩虹条纹 --- */
  cylinder(CX,L1.top,L1.bot,L1.rx,function(x,y,w,h){
    var sw=6;
    for(var sx=0;sx<w;sx+=sw){
      /* 圆柱面角度映射：条纹随 rot 沿柱面流动，呈现真实旋转感 */
      var k=clamp(((x+sx)-CX)/L1.rx,-1,1);
      var hue=((Math.acos(k)*300/Math.PI)+rot*57.3)%360;
      ctx.fillStyle="hsl("+hue+",80%,77%)";
      ctx.fillRect(x+sx,y,sw+1,h);
    }
  });
  dripBand(CX,L1.top,L1.rx,L1.rx*0.24,drips3,"#fff6fa");
  dollops(CX,L1.top,L1.rx,L1.rx*0.24,"#fff6fa");
  topFace(CX,L1.top,L1.rx,"#ffeaf4");
  beadBorder(CX,L1.bot,L1.rx,L1.rx*0.24,6.5);

  /* 第一层台面上的糖屑 + 小人剪影（随旋转绕行） */
  var i,s,d,dep,sx,sy;
  for(i=0;i<sprinkles.length;i++){
    s=sprinkles[i];
    if(s.layer!==1) continue;
    var a1=s.a+rot;
    sx=CX+Math.cos(a1)*L1.rx*0.82*s.r;
    sy=L1.top+Math.sin(a1)*L1.rx*0.24*0.82*s.r;
    dep=(Math.sin(a1)+1)/2;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(s.rot+rot);
    ctx.globalAlpha=0.45+0.55*dep;
    ctx.fillStyle=s.c; ctx.fillRect(-4,-1.4,8,2.8);
    ctx.restore();
  }
  for(i=0;i<figures.length;i++){
    var fa=figures[i].a+rot;
    var fdep=Math.sin(fa);
    if(fdep<=0.08) continue;
    var fx=CX+Math.cos(fa)*(L1.rx-30);
    figure(fx,L1.top-4,0.9+0.25*fdep,figures[i].c,0.35+0.6*fdep,t,i*2.3);
  }

  /* --- 第二层：香芋薰衣草渐变 + 星星糖 --- */
  cylinder(CX,L2.top,L2.bot,L2.rx,function(x,y,w,h){
    var g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,"#d3b0f5"); g.addColorStop(0.5,"#c39bf0"); g.addColorStop(1,"#f0b8e0");
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  });
  for(i=0;i<stars2.length;i++){
    s=stars2[i];
    var a2=s.a+rot;
    d=Math.sin(a2);
    if(d<=0.05) continue;
    sx=CX+Math.cos(a2)*(L2.rx-7);
    sy=L2.top+clamp(s.y,8,L2.bot-L2.top-10);
    star(sx,sy,s.s*(0.7+0.4*d),rot+i,s.c,0.35+0.65*d);
  }
  dripBand(CX,L2.top,L2.rx,L2.rx*0.24,drips2,"#ffd9ec");
  dollops(CX,L2.top,L2.rx,L2.rx*0.24,"#ffd9ec");
  topFace(CX,L2.top,L2.rx,"#ffe9f4");
  beadBorder(CX,L2.bot,L2.rx,L2.rx*0.24,5.5);

  /* --- 第三层：薄荷奶糖渐变 --- */
  cylinder(CX,L3.top,L3.bot,L3.rx,function(x,y,w,h){
    var g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,"#8fe3c5"); g.addColorStop(0.45,"#baf0da");
    g.addColorStop(0.75,"#e0f8ec"); g.addColorStop(1,"#9fe8cd");
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  });
  topFace(CX,L3.top,L3.rx,"#fff6fa");
  dollops(CX,L3.top,L3.rx,L3.rx*0.24,"#fff6fa");
  beadBorder(CX,L3.bot,L3.rx,L3.rx*0.24,4.5);
  for(i=0;i<sprinkles.length;i++){
    s=sprinkles[i];
    if(s.layer!==3) continue;
    var a3=s.a+rot;
    sx=CX+Math.cos(a3)*L3.rx*0.8*s.r;
    sy=L3.top+Math.sin(a3)*L3.rx*0.24*0.8*s.r;
    dep=(Math.sin(a3)+1)/2;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(s.rot-rot);
    ctx.globalAlpha=0.45+0.55*dep;
    ctx.fillStyle=s.c; ctx.fillRect(-3.5,-1.2,7,2.4);
    ctx.restore();
  }

  /* 蜡烛：围绕顶层台面绕行，近大远小，直观呈现旋转 */
  var ch=[58,66,74,64,60];
  var cl=[];
  for(i=0;i<5;i++){
    var ca=i*TAU/5+rot;
    var cdep=Math.sin(ca);
    cl.push({
      x:CX+Math.cos(ca)*L3.rx*0.55,
      y:L3.top+2+cdep*L3.rx*0.24*0.55,
      d:cdep, h:ch[i], s:i
    });
  }
  cl.sort(function(a,b){ return a.d-b.d; });  /* 后面的先画，近处的最后画 */
  var cstripe=["#ff8fb3","#7fd8c0","#b39df0","#6cc8f0","#ffb27d"];
  for(i=0;i<cl.length;i++){
    var c0=cl[i];
    var cs=0.78+0.27*((c0.d+1)/2);
    ctx.save();
    ctx.translate(c0.x,c0.y); ctx.scale(cs,cs); ctx.translate(-c0.x,-c0.y);
    ctx.globalAlpha=0.68+0.32*((c0.d+1)/2);
    candle(c0.x,c0.y,c0.h,t,c0.s*1.7,cstripe[c0.s%cstripe.length]);
    ctx.restore();
  }
}

/* 前景彩纸 */
var confetti=[];
for(var ci=0;ci<34;ci++) confetti.push({
  x:rnd(0,W),y:rnd(0,H),vy:rnd(0.4,1.2),vx:rnd(-0.3,0.3),
  r:rnd(3,6.5),rot:rnd(0,TAU),vr:rnd(-0.03,0.03),
  c:["#ff6b81","#ffd166","#6cd4ff","#c56cf0","#7bed9f","#ff9f1c"][ci%6]
});
function simConfetti(t){
  for(var i=0;i<confetti.length;i++){
    var c=confetti[i];
    c.y+=c.vy; c.x+=c.vx+Math.sin(t*1.5+i)*0.35; c.rot+=c.vr;
    if(c.y>H+10){ c.y=-10; c.x=rnd(0,W); }
  }
}
function drawConfetti(){
  for(var i=0;i<confetti.length;i++){
    var c=confetti[i];
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.globalAlpha=0.85; ctx.fillStyle=c.c;
    ctx.fillRect(-c.r,-c.r*0.55,c.r*2,c.r*1.1);
    ctx.restore();
  }
}

/* 文字工具 */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(text,maxW,font){
  ctx.font=font;
  var lines=[],line="";
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(ch==="\n"){ lines.push(line); line=""; continue; }
    if(ctx.measureText(line+ch).width>maxW){ lines.push(line); line=ch; }
    else line+=ch;
  }
  if(line) lines.push(line);
  return lines;
}

function heart(x,y,s,color,alpha){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(0,6);
  ctx.bezierCurveTo(-13,-6,-7,-18,0,-10);
  ctx.bezierCurveTo(7,-18,13,-6,0,6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

  star(-215,-24,9,t,"#ffd166",0.95);
  star(215,20,7,-t,"#ffd166",0.9);

  ctx.save();

  ctx.restore();

  ctx.save();

  ctx.lineWidth=5; ctx.strokeStyle="rgba(140,30,85,0.45)"; ctx.lineJoin="round";
  ctx.strokeText("-- 愿你被这个世界温柔以待 --",CX,868);
  ctx.fillStyle="#fff5fa";
  ctx.fillText("-- 愿你被这个世界温柔以待 --",CX,868);
  ctx.restore();

  /* 信笺 */
  var bless=state.bless||"（满满的祝福，都在心里）";
  var lines=wrapText(bless,540,'400 27px "Yuanti SC","PingFang SC",sans-serif');
  if(lines.length>6){ lines=lines.slice(0,6); lines[5]=lines[5].slice(0,-1)+"…"; }
  var cardH=96+lines.length*42+28;

  ctx.fillStyle="rgba(255,251,253,0.94)"; ctx.fill();
  ctx.shadowColor="transparent"; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.strokeStyle="#ffb6d5"; ctx.lineWidth=3;

  rr(68,cy0+12,W-136,cardH-24,14); ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign="left"; ctx.textBaseline="middle";
  heart(97,cy0+42,1.05,"#ff4d8d");
  ctx.font='800 29px "Yuanti SC","PingFang SC",sans-serif';

  ctx.fillText("To "+state.nick+"：",116,cy0+46);

  ctx.font='400 27px "Yuanti SC","PingFang SC",sans-serif';
  ctx.fillStyle="#5a3d5c";
  for(var i=0;i<lines.length;i++){
    ctx.fillText(lines[i],88,cy0+96+i*42);

  /* 画布底部装饰爱心 */
  var hb=0.6+0.4*Math.abs(Math.sin(t*2));
  heart(CX-70,1240,0.8*hb,"#e0447c",0.75);
  heart(CX,1236,1.05*hb,"#c22164",0.9);
  heart(CX+70,1240,0.8*hb,"#e0447c",0.75);
}

/* 主循环 */
var animStarted=false, startTs=0, rot=0, paused=false;
/* 场景状态推进一步（约 1/60 秒） */
function simTick(t){
  rot+=ROT_SPEED/60;
  simFw(t);
  simConfetti(t);
}
/* 场景绘制一帧 */
function drawScene(t){
  /* 天空：浅粉浪漫渐变（与封面同色系） */
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#f08ab5"); sky.addColorStop(0.45,"#f7a8ca");
  sky.addColorStop(0.75,"#ffc9df"); sky.addColorStop(1,"#ffe6f1");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  /* 闪烁星星 */
  for(var i=0;i<bgStars.length;i++){
    var s=bgStars[i];
    ctx.globalAlpha=0.25+0.6*Math.abs(Math.sin(t*s.sp+s.ph));
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;

  /* 粉色氛围光 */
  var amb=ctx.createRadialGradient(CX,560,50,CX,560,560);
  amb.addColorStop(0,"rgba(255,215,235,0.18)"); amb.addColorStop(1,"rgba(255,215,235,0)");
  ctx.fillStyle=amb; ctx.fillRect(0,0,W,H);

  drawFw(t);
  drawCake(t,rot);
  drawTexts(t);
  drawConfetti();
}
function loop(ts){
  requestAnimationFrame(loop);
  if(paused) return;
  if(!startTs) startTs=ts;
  var t=(ts-startTs)/1000;
  simTick(t);
  drawScene(t);
}
function startAnim(){
  if(animStarted) return;
  animStarted=true;
  requestAnimationFrame(loop);
}

/* ================= 生成并下载 9:16 视频 ================= */
var DUR=22, FPS=30;
var busy=false;
var BTN_TEXT="🎬 下载祝福视频（发给朋友）";

function yield0(){ return new Promise(function(r){ setTimeout(r,0); }); }
function showOverlay(label){
  $("recLabel").textContent=label;
  $("recOverlay").classList.remove("hidden");
}
function setPct(p){ $("recSec").textContent=p+"%"; }
function hideOverlay(){ $("recOverlay").classList.add("hidden"); }
function downloadBlob(blob,filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
}
function finishBtn(btn){
  busy=false;
  btn.disabled=false; btn.textContent=BTN_TEXT;
  hideOverlay();
}
/* 把音乐循环拼接成指定时长、指定采样率的 PCM（含重采样） */
function buildPcm(seconds,targetSr){
  var sr0=audioBuffer.sampleRate, nch=Math.min(2,audioBuffer.numberOfChannels);
  var sr=targetSr||sr0;
  var total=Math.floor(seconds*sr), ch=[];
  for(var c=0;c<nch;c++){
    var src=audioBuffer.getChannelData(c), L=src.length, dst=new Float32Array(total);
    for(var i=0;i<total;i++){
      var pos=i*sr0/sr;
      dst[i]=src[Math.floor(pos)%L];   /* 就近采样，同时实现循环 */
    }
    ch.push(dst);
  }
  return {ch:ch,sr:sr,nch:nch,total:total};
}
/* 快速通道：WebCodecs 离线逐帧编码 MP4（含音乐），无需实时录制 */
async function generateMp4(btn){
  busy=true; btn.disabled=true; btn.textContent="⏳ 正在生成…";
  showOverlay("正在生成祝福视频…"); setPct(0);
  var mainCv=cv, mainCtx=ctx, off=null;
  paused=true;
  try{
    if(decodePromise) await decodePromise;
    if(!audioBuffer) throw new Error("audio");

    var vcfg=null;
    var vcands=["avc1.640028","avc1.42E028","avc1.42001f"];
    for(var i=0;i<vcands.length;i++){
      var cfg={codec:vcands[i],width:W,height:H,bitrate:6000000,framerate:FPS};
      try{
        var s=await VideoEncoder.isConfigSupported(cfg);
        if(s.supported){ vcfg=vcands[i]; break; }
      }catch(e){}
    }
    if(!vcfg) throw new Error("video encoder");
    /* 音频编码：优先 AAC，其次 Opus（均封装进 MP4） */
    var sr=audioBuffer.sampleRate, nch=Math.min(2,audioBuffer.numberOfChannels);
    var acands=[
      {enc:"mp4a.40.2",mux:"aac",sr:sr,fr:1024},
      {enc:"opus",mux:"opus",sr:48000,fr:960}
    ];
    var acfg=null, amux=null, asr=sr, afr=1024;
    for(var ai=0;ai<acands.length;ai++){
      var cand=acands[ai];
      var c2={codec:cand.enc,sampleRate:cand.sr,numberOfChannels:nch,bitrate:128000};
      try{
        var asup=await AudioEncoder.isConfigSupported(c2);
        if(asup.supported){ acfg=c2; amux=cand.mux; asr=cand.sr; afr=cand.fr; break; }
      }catch(e){}
    }
    if(!acfg) throw new Error("audio encoder");

    var encErr=null;
    var muxer=new Mp4Muxer.Muxer({
      target:new Mp4Muxer.ArrayBufferTarget(),
      video:{codec:"avc",width:W,height:H},
      audio:{codec:amux,sampleRate:asr,numberOfChannels:nch},
      fastStart:"in-memory",
      firstTimestampBehavior:"offset"
    });
    var venc=new VideoEncoder({
      output:function(c,m){ muxer.addVideoChunk(c,m); },
      error:function(e){ encErr=e; }
    });
    venc.configure({codec:vcfg,width:W,height:H,bitrate:6000000,framerate:FPS});
    var aenc=new AudioEncoder({
      output:function(c,m){ muxer.addAudioChunk(c,m); },
      error:function(e){ encErr=e; }
    });
    aenc.configure(acfg);

    /* 切到离屏画布，重置场景状态，保证视频从干净的画面开始 */
    off=document.createElement("canvas"); off.width=W; off.height=H;
    cv=off; ctx=off.getContext("2d");
    rockets.length=0; parts.length=0; flashes.length=0; lastLaunch=0; rot=0;
    for(var ci=0;ci<confetti.length;ci++){ confetti[ci].x=rnd(0,W); confetti[ci].y=rnd(0,H); }

    var total=DUR*FPS, offT=0;
    for(var f=0;f<total;f++){
      simTick(offT); offT+=1/60;
      simTick(offT); offT+=1/60;   /* 每输出帧推进 2 步 ≈ 60fps 的动画节奏 */
      drawScene(offT);
      var vf=new VideoFrame(off,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});
      venc.encode(vf,{keyFrame:(f%90===0)});
      vf.close();
      if(f%15===0){ setPct(Math.round(f/total*70)); await yield0(); }
      if(encErr) throw encErr;
    }
    await venc.flush();
    if(encErr) throw encErr;

    /* 音频：22 秒 PCM 分块编码 */
    var pcm=buildPcm(DUR,asr);
    var FR=afr;
    for(var o=0;o<pcm.total;o+=FR){
      var n=Math.min(FR,pcm.total-o);
      var data=new Float32Array(n*pcm.nch);
      for(var c=0;c<pcm.nch;c++) data.set(pcm.ch[c].subarray(o,o+n),c*n);
      var ad=new AudioData({format:"f32-planar",sampleRate:asr,numberOfFrames:n,
        numberOfChannels:pcm.nch,timestamp:Math.round(o/asr*1e6),data:data.buffer});
      aenc.encode(ad); ad.close();
      if(((o/FR)|0)%60===0){ setPct(70+Math.round(o/pcm.total*25)); await yield0(); }
      if(encErr) throw encErr;
    }
    await aenc.flush();
    if(encErr) throw encErr;

    setPct(96); await yield0();
    muxer.finalize();
    var blob=new Blob([muxer.target.buffer],{type:"video/mp4"});

    cv=mainCv; ctx=mainCtx; paused=false;
    downloadBlob(blob,"生日快乐-"+state.nick+".mp4");
    finishBtn(btn);
    showToast("视频已保存，快发给 "+state.nick+" 吧 🎉");
  }catch(err){
    if(off){ cv=mainCv; ctx=mainCtx; }
    paused=false;
    busy=false; btn.disabled=false;
    hideOverlay();
    legacyRecord(btn);   /* 浏览器不支持离线编码时，回退到实时录制 */
  }
}
/* 兼容通道：实时录制（旧浏览器兜底） */
function legacyRecord(btn){
  if(typeof MediaRecorder==="undefined"||!cv.captureStream){
    finishBtn(btn);
    showToast("当前浏览器不支持视频生成，可截图分享哦～");
    return;
  }
  var mimes=["video/mp4","video/webm;codecs=h264","video/webm;codecs=vp9","video/webm"];
  var mime=null;
  for(var i=0;i<mimes.length;i++){
    try{ if(MediaRecorder.isTypeSupported(mimes[i])){ mime=mimes[i]; break; } }catch(e){}
  }
  if(!mime){ finishBtn(btn); showToast("当前浏览器不支持视频生成，可截图分享哦～"); return; }

  busy=true;
  btn.disabled=true; btn.textContent="🎬 录制中…";
  showOverlay("当前浏览器需实时录制，请稍候…");
  if(!muted) restartSong();

  var vStream=cv.captureStream(30);
  var tracks=[vStream.getVideoTracks()[0]];
  if(audioDest && audioDest.stream.getAudioTracks().length){
    tracks.push(audioDest.stream.getAudioTracks()[0]);
  }
  var rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:8000000});
  var chunks=[];
  rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
  rec.onstop=function(){
    var ext=mime.indexOf("mp4")>=0?"mp4":"webm";
    downloadBlob(new Blob(chunks,{type:mime}),"生日快乐-"+state.nick+"."+ext);
    finishBtn(btn);
    showToast("视频已保存，快发给 "+state.nick+" 吧 🎉");
  };
  rec.start(250);

  var left=DUR;
  $("recSec").textContent=left+"s";
  var timer=setInterval(function(){
    left--;
    if(left<=0){
      clearInterval(timer);
      try{ rec.stop(); }catch(e){}
    }else{
      $("recSec").textContent=left+"s";
    }
  },1000);
}

$("downloadBtn").addEventListener("click",function(){
  if(busy) return;
  initAudio();
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  var fast=!!(window.VideoEncoder && window.AudioEncoder && window.Mp4Muxer && window.VideoFrame && window.AudioData);
  if(fast) generateMp4(this);
  else legacyRecord(this);
});
